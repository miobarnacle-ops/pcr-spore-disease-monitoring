spore_patrol_base_driver:
  ros__parameters:
    port: /dev/ttyACM0
    baud: 115200
    command_rate_hz: 20.0
    cmd_vel_timeout_s: 0.30
    feedback_timeout_s: 0.50
    max_linear_mps: 0.15
    max_angular_radps: 0.30
    max_linear_accel_mps2: 0.40
    max_angular_accel_radps2: 0.80
    battery_warn_voltage: 21.0
    battery_error_voltage: 20.0
    use_feedback_vy: false
    publish_tf: true
    publish_imu: true
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: imu_link
    # Both supported firmware IMUs are configured for +/-2 g and +/-500 deg/s.
    accel_lsb_per_g: 16384.0
    gyro_lsb_per_deg_s: 65.5
