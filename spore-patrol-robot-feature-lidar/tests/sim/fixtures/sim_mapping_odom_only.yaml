slam_toolbox:
  ros__parameters:
    # Diagnostic profile: isolate Gazebo odometry from scan-matching drift.
    # This is not the mapping baseline; it is used to decide whether a
    # distorted map comes from the motion model or the SLAM configuration.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    use_map_saver: true
    use_scan_matching: false
    use_scan_barycenter: false
    do_loop_closing: false
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.12
    max_laser_range: 8.0
    minimum_time_interval: 0.05
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
