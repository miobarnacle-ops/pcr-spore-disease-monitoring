[project]
name = "spore-monitor-pipeline"
version = "0.1.0"
description = "Offline Python pipeline producing dispersion-model artifacts for spore-monitor-web"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
